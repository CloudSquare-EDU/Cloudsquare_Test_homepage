# NCP 배포용 — .env.prod 파일에서 환경변수 읽음
# 사용법: docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ${NCR_REGISTRY}/mockexam-backend:latest
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${NCR_REGISTRY}/mockexam-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.prod
    depends_on:
      - backend
